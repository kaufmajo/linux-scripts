# Config for backup.sh - copy to backup.conf and adjust.
# Counterpart: win_scripts/config/backup.xml (same drive settings).
#
# This file is bash code (it gets "sourced"): no spaces around "=",
# quote values that contain spaces.

WIN="/mnt/c/Users/username"   # helper variable, only used in this file

#---------------------------------------------------------------
# Backup drives
#
# LETTER     Windows drive letter (mounted at /mnt/<letter>)
# LABEL      Volume label (safety check: the drive is only used if it matches)
# BITLOCKER  true: unlock with WIN_UNLOCK_SCRIPT if the drive is locked
# ENVVAR     Name of the variable holding the BitLocker password (read by WIN_UNLOCK_SCRIPT)

MASTER_LETTER="X"
MASTER_LABEL="masterdrive"
MASTER_BITLOCKER=true
MASTER_ENVVAR="master_password_env"

SLAVE_LETTER="Y"
SLAVE_LABEL="slavedrive"
SLAVE_BITLOCKER=true
SLAVE_ENVVAR="slave_password_env"

#---------------------------------------------------------------
# Target
#
# TARGET_FOLDER  Mirror goes to X:\<hostname>\<TARGET_FOLDER>\<user>\
# HISTORY_KEEP   Number of history folders kept per backup drive

TARGET_FOLDER="wsl-debian"
HISTORY_KEEP=30

#---------------------------------------------------------------
# Windows scripts (as WSL paths)
#
# WIN_UNLOCK_SCRIPT  Script that unlocks BitLocker drives
# WIN_BACKUP_SCRIPT  Windows backup, started with --with-windows

WIN_UNLOCK_SCRIPT="$WIN/path/to/win_scripts/Enable-BitlockerDrive.ps1"
WIN_BACKUP_SCRIPT="$WIN/path/to/win_scripts/Backup.ps1"

#---------------------------------------------------------------
# What to back up
#
# SOURCES   Each source keeps its full path below the target (/var/www -> <target>/var/www)
# EXCLUDES  Rule of thumb: exclude what can be downloaded again.
#           Leading "/" = full path; without it = matches anywhere.

SOURCES=(
    "$HOME"
    "/var/www"
    "/etc/apache2"
)

EXCLUDES=(
    "$HOME/.vscode-server/"
    "$HOME/.cache/"
    "node_modules/"
    "vendor/"
)
